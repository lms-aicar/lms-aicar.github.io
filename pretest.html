<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่า Pre-test</title><link rel="stylesheet" href="styles.css"></head><body><main class="account-shell"><header class="account-header"><a class="account-brand" href="dashboard.html">AI AUTO CAR / BLUEPRINT LAB</a></header><h1>ตั้งค่า Pre-test</h1><p>เมนูนี้สร้างชุดข้อสอบก่อนเรียนจากคลังคำถามของรายวิชา และกำหนดกติกาเฉพาะชุดนั้น</p><p id="pretest-status" class="form-status"></p><form id="pretest-form" class="admin-form"><label>รายวิชา<select id="pretest-course" name="courseId" required></select></label><label>ชื่อ Pre-test<input name="title" value="แบบทดสอบก่อนเรียน" required maxlength="160"></label><label>จำนวนข้อ<input name="questionCount" type="number" min="1" value="5" required></label><label>เวลาทำ (นาที)<input name="timeLimitMinutes" type="number" min="1" value="15" required></label><label>จำนวนครั้งที่ทำได้<input name="maxAttempts" type="number" min="1" value="3" required></label><label>คะแนนผ่าน (%)<input name="passingScore" type="number" min="0" max="100" value="70" required></label><button class="primary-button" type="submit">เปิดใช้ Pre-test <b>→</b></button></form></main><script src="config.js"></script><script src="api.js"></script><script src="pretest.js"></script></body></html>
