<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่า Post-test</title><link rel="stylesheet" href="styles.css"></head><body><main class="account-shell"><header class="account-header"><a class="account-brand" href="dashboard.html">AI AUTO CAR / BLUEPRINT LAB</a></header><h1>ตั้งค่า Post-test</h1><p>กำหนดข้อสอบหลังเรียนสำหรับรายวิชา กติกาทุกค่าใช้เฉพาะชุดนี้</p><p id="status" class="form-status"></p><form id="form"><label>รายวิชา<select id="course" name="courseId" required></select></label><label>หน่วยเรียน<select id="unit" name="unitNumber"><option value="">รวมทั้งรายวิชา</option><option value="1">หน่วย 1</option><option value="2">หน่วย 2</option><option value="3">หน่วย 3</option></select></label><label>ชื่อ Post-test<input name="title" value="แบบทดสอบหลังเรียน" required></label><label>จำนวนข้อ<input id="question-count" name="questionCount" type="number" min="1" value="5" required></label><label>เวลาทำ (นาที)<input name="timeLimitMinutes" type="number" min="1" value="15" required></label><label>จำนวนครั้งที่ทำได้ (0 = ไม่จำกัด)<input id="max-attempts" name="maxAttempts" type="number" min="0" value="1" required></label><label>เปิดให้เริ่มทำ (เว้นว่าง = ทันที)<input name="opensAt" type="datetime-local"></label><label>ปิดรับการเริ่มทำ (เว้นว่าง = ไม่กำหนด)<input name="closesAt" type="datetime-local"></label><button class="primary-button">เปิดใช้ Post-test <b>→</b></button></form></main><script src="config.js"></script><script src="api.js"></script><script src="posttest.js"></script></body></html>
