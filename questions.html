<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คลังคำถาม</title><link rel="stylesheet" href="styles.css"></head><body><main class="account-shell"><header class="account-header"><a class="account-brand" href="dashboard.html">AI AUTO CAR / BLUEPRINT LAB</a></header><h1>คลังคำถาม</h1><p>เพิ่มคำถามสำหรับ Pre-test หรือ Post-test เฉลยเก็บเฉพาะระบบหลังบ้าน</p><p id="status" class="form-status"></p><form id="form"><label>รายวิชา<select id="course" name="courseId" required></select></label><label>คำถาม<textarea name="prompt" required></textarea></label><label>ตัวเลือก ก<input name="choice0" required></label><label>ตัวเลือก ข<input name="choice1" required></label><label>ตัวเลือก ค<input name="choice2"></label><label>ตัวเลือก ง<input name="choice3"></label><label>คำตอบที่ถูกต้อง<select name="answerIndex"><option value="0">ก</option><option value="1">ข</option><option value="2">ค</option><option value="3">ง</option></select></label><button class="primary-button">บันทึกคำถาม <b>→</b></button></form><section class="admin-panel"><h2>คำถามในรายวิชา</h2><div class="user-table-wrap"><table class="user-table"><thead><tr><th>คำถาม</th><th>สถานะ</th><th>การทำงาน</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="config.js"></script><script src="api.js"></script><script src="questions.js"></script></body></html>
