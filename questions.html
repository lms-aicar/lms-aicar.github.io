<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คลังคำถาม</title><link rel="stylesheet" href="styles.css"></head><body><main class="account-shell"><header class="account-header"><a class="account-brand" href="dashboard.html">AI AUTO CAR / BLUEPRINT LAB</a></header><h1>คลังคำถาม Pre-test</h1><p>เมนูนี้ใช้เพิ่มคำถามแบบเลือกตอบหนึ่งข้อ คำตอบที่ถูกต้องจะเก็บในระบบหลังบ้านและไม่แสดงแก่นักเรียน</p><p id="question-status" class="form-status" role="status"></p><form id="question-form" class="admin-form"><label>รายวิชา<select id="question-course" name="courseId" required></select></label><label>คำถาม<textarea name="prompt" maxlength="4000" required></textarea></label><label>ตัวเลือก ก<input name="choice0" required maxlength="500"></label><label>ตัวเลือก ข<input name="choice1" required maxlength="500"></label><label>ตัวเลือก ค<input name="choice2" maxlength="500"></label><label>ตัวเลือก ง<input name="choice3" maxlength="500"></label><label>คำตอบที่ถูกต้อง<select name="answerIndex"><option value="0">ก</option><option value="1">ข</option><option value="2">ค</option><option value="3">ง</option></select></label><button class="primary-button" type="submit">บันทึกคำถาม <b>→</b></button></form></main><script src="config.js"></script><script src="api.js"></script><script src="questions.js"></script></body></html>
