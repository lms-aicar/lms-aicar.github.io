<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งรหัสผ่านใหม่</title><link rel="stylesheet" href="styles.css"></head><body><main class="auth-shell"><section class="signin-panel"><h1>ตั้งรหัสผ่านใหม่</h1><p>ขอรหัสครั้งเดียวจากอีเมลที่ผู้ดูแลบันทึกไว้</p><form id="request-form"><label>รหัสผู้ใช้<input name="username" required autocomplete="username"></label><label>อีเมล<input name="email" type="email" required autocomplete="email"></label><button class="primary-button">ขอรหัสครั้งเดียว</button></form><hr><form id="reset-form"><label>รหัสผู้ใช้<input name="username" required autocomplete="username"></label><label>รหัสครั้งเดียวจากอีเมล<input name="resetCode" required autocomplete="one-time-code"></label><label>รหัสผ่านใหม่ อย่างน้อย 12 ตัวอักษร<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="primary-button">ตั้งรหัสผ่านใหม่</button></form><p id="status" class="form-status" role="status" aria-live="polite"></p><a href="index.html">กลับไปเข้าสู่ระบบ</a></section></main><script src="config.js"></script><script src="api.js"></script><script src="reset.js"></script></body></html>
