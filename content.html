<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการเนื้อหาบทเรียน</title><link rel="stylesheet" href="styles.css"></head><body><main class="account-shell"><header class="account-header"><a class="account-brand" href="dashboard.html">AI AUTO CAR / BLUEPRINT LAB</a></header><h1>จัดการเนื้อหาบทเรียน</h1><p>เลือกบทเรียน แล้วเพิ่มข้อความหรือ URL สื่อ HTTPS เช่น YouTube, PDF, เสียง และรูปภาพ</p><p id="content-status" class="form-status"></p><form id="content-form" class="admin-form"><label>บทเรียน<select name="lessonId" id="lesson-id" required></select></label><label>ชนิดเนื้อหา<select name="contentType"><option value="TEXT">ข้อความ</option><option value="VIDEO">วิดีโอ</option><option value="AUDIO">เสียง</option><option value="PDF">PDF</option><option value="IMAGE">รูปภาพ</option><option value="LINK">ลิงก์</option></select></label><label>ข้อความ/คำอธิบาย<textarea name="body" maxlength="12000"></textarea></label><label>URL สื่อ HTTPS<input name="mediaUrl" type="url" placeholder="https://..."></label><label>ลำดับ<input name="sortOrder" type="number" min="1" value="1" required></label><button class="primary-button" type="submit">เพิ่มเนื้อหา <b>→</b></button></form><section aria-labelledby="publish-title"><h2 id="publish-title">สถานะเผยแพร่</h2><p>เผยแพร่หน่วยก่อนบทเรียน บทเรียนร่างจะไม่แสดงแก่ผู้เรียน</p><div id="publish-list" class="course-grid"></div></section></main><script src="config.js"></script><script src="api.js"></script><script src="content.js"></script></body></html>
