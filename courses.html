<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>จัดการรายวิชา</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="account-shell"><header class="account-header"><a href="dashboard.html" class="account-brand">AI AUTO CAR / BLUEPRINT LAB</a></header><section><h1>สร้างรายวิชาและบทเรียน</h1><p id="course-status" class="form-status" role="status"></p><form id="course-form" class="admin-form"><label>ชื่อรายวิชา<input name="title" required maxlength="160"></label><label>คำอธิบาย<textarea name="description" maxlength="4000"></textarea></label><label>รูปแบบ<select name="courseType"><option value="open">วิชาเปิดลงทะเบียนเอง</option><option value="formal">วิชาในภาคเรียน</option></select></label><label>ปีการศึกษา<input name="academicYear" maxlength="30"></label><label>ภาคเรียน<input name="semester" maxlength="30"></label><button class="primary-button" type="submit">สร้างรายวิชาแบบร่าง</button></form><section id="authoring-panel" hidden><h2 id="draft-title"></h2><div class="account-grid"><section class="account-panel"><h3>เพิ่มหน่วยการเรียน</h3><form id="unit-form" class="admin-form"><label>ชื่อหน่วย<input name="title" required maxlength="160"></label><label>ลำดับ<input name="sortOrder" type="number" min="1" value="1" required></label><button class="secondary-button" type="submit">เพิ่มหน่วย</button></form><ul id="unit-list"></ul></section><section id="lesson-panel" class="account-panel" hidden><h3>เพิ่มบทเรียน: <span id="selected-unit"></span></h3><form id="lesson-form" class="admin-form"><label>ชื่อบทเรียน<input name="title" required maxlength="160"></label><label>ลิงก์เนื้อหา HTTPS<input name="contentUrl" type="url" maxlength="2048" placeholder="https://..."></label><label>ลำดับ<input name="sortOrder" type="number" min="1" value="1" required></label><button class="secondary-button" type="submit">เพิ่มบทเรียน</button></form><ul id="lesson-list"></ul></section></div><button id="publish-course" class="primary-button" type="button">เผยแพร่รายวิชา</button></section></section></main><script src="config.js"></script><script src="api.js"></script><script src="courses.js"></script></body></html>
