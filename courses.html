<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>จัดการรายวิชา</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="account-shell"><header class="account-header"><a href="dashboard.html" class="account-brand">AI AUTO CAR / BLUEPRINT LAB</a></header><section><h1>สร้างรายวิชา</h1><p id="course-status" class="form-status" role="status"></p><form id="course-form" class="admin-form"><label>ชื่อรายวิชา<input name="title" required maxlength="160"></label><label>คำอธิบาย<textarea name="description" maxlength="4000"></textarea></label><label>รูปแบบ<select name="courseType"><option value="open">วิชาเปิดลงทะเบียนเอง</option><option value="formal">วิชาในภาคเรียน</option></select></label><label>ปีการศึกษา<input name="academicYear" maxlength="30"></label><label>ภาคเรียน<input name="semester" maxlength="30"></label><button class="primary-button" type="submit">สร้างรายวิชาแบบร่าง</button></form><section id="publish-panel" class="account-panel" hidden><h2 id="draft-title"></h2><button id="publish-course" class="primary-button" type="button">เผยแพร่รายวิชา</button></section></section></main><script src="config.js"></script><script src="api.js"></script><script src="courses.js"></script></body></html>
